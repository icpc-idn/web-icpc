<span class="row g-0">
  <aside id="sidebar" aria-labelledby="sidebar" class="offcanvas-md offcanvas-start d-md-inline-block col-md-4 p-0" style="max-width: 256px;">
    {{- partial "components/sidebar" . }}
  </aside>

  <article class="col p-3">
    <header class="mb-4 w-100">
      <h1>{{- .Title }}</h1>
      {{- if not .IsSection }}
        <time class="fst-italic" datetime='{{ .Date.Format "2006-01-02T15:04:05Z0700" }}'>
          Last modified: {{ .Lastmod.Format "02 Jan 2006, 15:04 MST" }}
        </time>
      {{- end }}
    </header>

    {{ inner . }}
  </article>
</span>
