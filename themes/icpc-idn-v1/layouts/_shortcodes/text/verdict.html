{{- $verdict := (.Get 0) -}}
{{- $color := "red" -}}
{{- if eq ($verdict | lower) "correct" -}}
  {{- $color = "green" -}}
{{- end -}}

<span class="text-uppercase font-monospace" style="color: {{ $color }}">
  {{- $verdict | markdownify -}}
</span>
