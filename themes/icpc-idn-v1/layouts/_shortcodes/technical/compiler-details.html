{{- with index hugo.Data (.Get "year") "technical" (.Get "src") }}
  <ul>
    {{- range .compilers }}
      <li>{{ .name }}
        {{- if .version }}
          <table class="table table-striped table-bordered">
            <tbody>
              <tr><td class="col-1">Version</td><td><code>{{ .version }}</code></td></tr>
              <tr><td>Compile</td><td><code>{{ .compile }}</code></td></tr>
              <tr><td>Run</td><td><code>{{ .run }}</code></td></tr>
            </tbody>
          </table>
        {{- else }}
          (TBA)
        {{- end }}
      </li>
    {{- end }}
  </ul>
{{- end }}
