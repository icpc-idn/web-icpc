{{- $finalized := .Get "finalized" }}

{{- with index hugo.Data .Page.Section (.Get "src") "technical" "compilers" (.Get "language") }}
  {{ .name }}
  {{- if and .version $finalized }}
    <table class="table table-striped table-bordered">
      <tbody>
        <tr><td class="col-1">Version</td><td><code>{{ .version }}</code></td></tr>
        <tr><td>Compile</td><td><code>{{ .compileOpts }}</code></td></tr>
        <tr><td>Run</td><td><code>{{ .runOpts }}</code></td></tr>
      </tbody>
    </table>
  {{- else }}
    (TBA)
  {{- end }}
{{- end }}
