{{- $firstSection := .Page.FirstSection }}

{{- $imgs := slice }}
{{- range .Params }}
  {{- with $firstSection.Resources.Get (printf "assets/%s" .) }}
    {{- $imgs = $imgs | append . }}
  {{- end }}
{{- end }}


<div class="container-fluid row gx-2 gy-2 mb-3 justify-content-center">
  {{- range $imgs }}
    <div class="col-4 col-sm-3">
      <img class="rounded img-fluid img-thumbnail" src="{{ .RelPermalink }}" />
    </div>
  {{- end }}
</div>
